<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teorema M_Paz - DNA Biomolecular Realista 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
      overflow: hidden;
      display: flex;
      height: 100vh;
    }
    #sidebar {
      width: 360px;
      background: #111827;
      border-right: 1px solid #1f2937;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
      box-shadow: 4px 0 15px rgba(0,0,0,0.5);
      overflow-y: auto;
    }
    h1 {
      font-size: 1.25rem;
      color: #38bdf8;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 10px;
    }
    .subtitle {
      font-size: 0.8rem;
      color: #9ca3af;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.85rem;
      color: #d1d5db;
      display: flex;
      justify-content: space-between;
    }
    input[type="range"], select {
      width: 100%;
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 6px;
      border-radius: 4px;
      outline: none;
    }
    input[type="range"] {
      accent-color: #38bdf8;
    }
    .math-box {
      background: #030712;
      border: 1px solid #1f2937;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #a7f3d0;
    }
    .legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.75rem;
      background: #1f2937;
      padding: 10px;
      border-radius: 6px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    #canvas-container {
      flex: 1;
      position: relative;
    }
    #info-overlay {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid #1f2937;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="sidebar">
    <div>
      <h1>DNA Realista M_Paz 3D</h1>
      <p class="subtitle">Estrutura Molecular do DNA Gerada Via Matriz Helicoidal Assimétrica</p>
    </div>

    <div class="math-box">
      <strong>Operador M_Paz:</strong><br>
      [ cos(θ)   0  -sin(θ) ]<br>
      [   0      1    ΔK    ]<br>
      [ sin(θ)   0   cos(θ) ]
    </div>

    <div class="legend">
      <div class="legend-item"><div class="color-dot" style="background:#ef4444"></div> Adenina (A)</div>
      <div class="legend-item"><div class="color-dot" style="background:#3b82f6"></div> Timina (T)</div>
      <div class="legend-item"><div class="color-dot" style="background:#10b981"></div> Citosina (C)</div>
      <div class="legend-item"><div class="color-dot" style="background:#f59e0b"></div> Guanina (G)</div>
    </div>

    <div class="control-group">
      <label for="theta">Torção Angular θ (rad): <span id="theta-val">0.63</span></label>
      <input type="range" id="theta" min="0.2" max="1.5" step="0.01" value="0.63">
    </div>

    <div class="control-group">
      <label for="deltak">Passo Axial ΔK: <span id="deltak-val">0.35</span></label>
      <input type="range" id="deltak" min="0.1" max="1.0" step="0.05" value="0.35">
    </div>

    <div class="control-group">
      <label for="radius">Raio M_Paz R: <span id="radius-val">3.50</span></label>
      <input type="range" id="radius" min="1.0" max="6.0" step="0.1" value="3.50">
    </div>

    <div class="control-group">
      <label for="count">Pares de Base N: <span id="count-val">30</span></label>
      <input type="range" id="count" min="10" max="80" step="1" value="30">
    </div>
  </div>

  <div id="canvas-container">
    <div id="info-overlay">
      <span id="elements-count">Pares de bases: 30</span> | Interativo: Arraste para girar
    </div>
  </div>

  <script>
    // CENA THREE.JS
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f19);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(18, 10, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // ILUMINAÇÃO
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight1.position.set(20, 40, 20);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 0.4);
    dirLight2.position.set(-20, -20, -20);
    scene.add(dirLight2);

    const dnaGroup = new THREE.Group();
    scene.add(dnaGroup);

    // MATERIAIS PARA BASES NITROGENADAS E BACKBONE
    const baseMaterials = {
      'A': new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 }), // Vermelho
      'T': new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3 }), // Azul
      'C': new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.3 }), // Verde
      'G': new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.3 })  // Amarelo
    };

    const backboneMat1 = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.2, metalness: 0.1 }); // Fosfato Strand 1
    const backboneMat2 = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.2, metalness: 0.1 }); // Fosfato Strand 2
    const bondMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.15, gapSize: 0.1 });

    // COORDENADAS M_PAZ
    function computeMPazPositions(N, R, theta, deltaK) {
      const positions = [];
      let currentPos = new THREE.Vector3(R, 0, 0);

      const cosT = Math.cos(theta);
      const sinT = Math.sin(theta);

      for (let n = 0; n < N; n++) {
        positions.push(currentPos.clone());
        const nextX = cosT * currentPos.x - sinT * currentPos.z;
        const nextY = currentPos.y + deltaK;
        const nextZ = sinT * currentPos.x + cosT * currentPos.z;
        currentPos.set(nextX, nextY, nextZ);
      }
      return positions;
    }

    // CRIAÇÃO DA ESTRUTURA REALISTA
    function rebuildDNA() {
      while(dnaGroup.children.length > 0) {
        const obj = dnaGroup.children.pop();
        if(obj.geometry) obj.geometry.dispose();
      }

      const theta = parseFloat(document.getElementById('theta').value);
      const deltaK = parseFloat(document.getElementById('deltak').value);
      const R = parseFloat(document.getElementById('radius').value);
      const N = parseInt(document.getElementById('count').value);

      const strand1 = computeMPazPositions(N, R, theta, deltaK);
      const strand2 = strand1.map(p => new THREE.Vector3(-p.x, p.y, -p.z));

      // Centralizar
      dnaGroup.position.y = -(N * deltaK) / 2;

      const path1 = new THREE.CatmullRomCurve3(strand1);
      const path2 = new THREE.CatmullRomCurve3(strand2);

      // 1. Fitas contínuas de açúcar-fosfato (Tubos helicoidais)
      const tubeGeo1 = new THREE.TubeGeometry(path1, N * 4, 0.25, 8, false);
      const tubeGeo2 = new THREE.TubeGeometry(path2, N * 4, 0.25, 8, false);
      dnaGroup.add(new THREE.Mesh(tubeGeo1, backboneMat1));
      dnaGroup.add(new THREE.Mesh(tubeGeo2, backboneMat2));

      // Secuenciamento aleatório fixo para demonstração
      const bases = ['AT', 'TA', 'CG', 'GC'];

      // 2. Bases emparelhadas e nós atômicos
      const nodeGeo = new THREE.SphereGeometry(0.35, 12, 12);

      for (let i = 0; i < N; i++) {
        const p1 = strand1[i];
        const p2 = strand2[i];

        // Esferas de fosfato
        const node1 = new THREE.Mesh(nodeGeo, backboneMat1);
        node1.position.copy(p1);
        dnaGroup.add(node1);

        const node2 = new THREE.Mesh(nodeGeo, backboneMat2);
        node2.position.copy(p2);
        dnaGroup.add(node2);

        // Seleção do par de bases
        const pair = bases[i % bases.length];
        const matA = baseMaterials[pair[0]];
        const matB = baseMaterials[pair[1]];

        // Ponto médio entre as duas fitas
        const midPoint = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);

        // Anel / Bastão da Base 1 (p1 ao centro)
        const dir1 = new THREE.Vector3().subVectors(midPoint, p1);
        const len1 = dir1.length();
        const cylinderGeo1 = new THREE.CylinderGeometry(0.15, 0.15, len1, 8);
        const cylinder1 = new THREE.Mesh(cylinderGeo1, matA);

        cylinder1.position.copy(p1).add(dir1.clone().multiplyScalar(0.5));
        cylinder1.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir1.clone().normalize());
        dnaGroup.add(cylinder1);

        // Anel / Bastão da Base 2 (p2 ao centro)
        const dir2 = new THREE.Vector3().subVectors(midPoint, p2);
        const len2 = dir2.length();
        const cylinderGeo2 = new THREE.CylinderGeometry(0.15, 0.15, len2, 8);
        const cylinder2 = new THREE.Mesh(cylinderGeo2, matB);

        cylinder2.position.copy(p2).add(dir2.clone().multiplyScalar(0.5));
        cylinder2.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir2.clone().normalize());
        dnaGroup.add(cylinder2);

        // Ligação de hidrogênio (Linha central pontilhada)
        const bondGeo = new THREE.BufferGeometry().setFromPoints([
          p1.clone().add(dir1.clone().multiplyScalar(0.8)),
          p2.clone().add(dir2.clone().multiplyScalar(0.8))
        ]);
        const bondLine = new THREE.Line(bondGeo, bondMat);
        bondLine.computeLineDistances();
        dnaGroup.add(bondLine);
      }

      document.getElementById('elements-count').innerText = `Pares de bases: ${N}`;
    }

    function updateUI() {
      document.getElementById('theta-val').innerText = parseFloat(document.getElementById('theta').value).toFixed(2);
      document.getElementById('deltak-val').innerText = parseFloat(document.getElementById('deltak').value).toFixed(2);
      document.getElementById('radius-val').innerText = parseFloat(document.getElementById('radius').value).toFixed(2);
      document.getElementById('count-val').innerText = document.getElementById('count').value;
    }

    ['theta', 'deltak', 'radius', 'count'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        updateUI();
        rebuildDNA();
      });
    });

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      dnaGroup.rotation.y += 0.006;
      controls.update();
      renderer.render(scene, camera);
    }

    updateUI();
    rebuildDNA();
    animate();
  </script>
</body>
</html>
