    const MAPA_NOTAS_MIDI = {
      "c": 0, "c#": 1, "db": 1, "d": 2, "d#": 3, "eb": 3, "e": 4, "f": 5, 
      "f#": 6, "gb": 6, "g": 7, "g#": 8, "ab": 8, "a": 9, "a#": 10, "bb": 10, "b": 11
    };

    let freqsTemaAtuais = [];
    let duracoesTemaAtuais = [];
    let audioCtx = null;
    let agendadorAudio = [];

    function notaParaFrequencia(stringNota, semitonsOffset = 0) {
      const [puro, oitava] = stringNota.split('/');
      const semitomBase = MAPA_NOTAS_MIDI[puro];
      const numeroMidi = (parseInt(oitava) + 1) * 12 + semitomBase + semitonsOffset;
      return 440 * Math.pow(2, (numeroMidi - 69) / 12);
    }

    function frequenciaParaNotaVexFlow(freq) {
      const nomes = ["c", "c#", "d", "d#", "e", "f", "f#", "g", "g#", "a", "a#", "b"];
      const midi = Math.round(69 + 12 * Math.log2(freq / 440));
      const nomeNota = nomes[(midi % 12 + 12) % 12];
      const oitava = Math.floor(midi / 12) - 1;
      return `${nomeNota}/${oitava}`;
    }

    // =============================================================
    // 2. TEORIA DE INDEXAÇÃO ALGEBRICA DE SISTEMAS HELICOIDAIS
    //    DIATÔNICOS ASSIMÉTRICOS (AUTOR: ALAN APARECIDO DA SILVA PAZ)
    // =============================================================

    function mpazHeliceHelicoidal(frequencias, fRef = 261.63, epsilon = 0.08) {
      const matrizHelicoidal = [];

      frequencias.forEach((freq, idx) => {
        // z representa o deslocamento ao longo do eixo da hélice (oitavas em relação a fRef)
        const z = Math.log2(freq / fRef);
        
        // Fase base angular diatônica
        const anguloBase = (2 * Math.PI) * (Math.log2(freq / fRef) % 1);
        
        // Modulador Assimétrico MPaz
        const modAssimetrico = 1 + (epsilon * Math.sin(anguloBase));
        const theta = anguloBase * modAssimetrico;

        // Projeções paramétricas tridimensionais do vetor espacial
        const r = 1.0;
        const x = r * Math.cos(theta);
        const y = r * Math.sin(theta);

        matrizHelicoidal.push({
          indice: idx + 1,
          freqHz: freq.toFixed(2),
          coordX: x.toFixed(4),
          coordY: y.toFixed(4),
          coordZ: z.toFixed(4),
          thetaRad: theta.toFixed(4)
        });
      });

      return matrizHelicoidal;
    }

    // =============================================================
    // 3. SINTETIZADOR FÍSICO DE VIOLONCELO E MOTOR DE ÁUDIO
    // =============================================================

    function tocarNotaVioloncelo(freq, tempoInicio, duracaoSeg) {
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, tempoInicio);

      // LFO para vibrato natural
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.frequency.value = 5.2; 
      lfoGain.gain.value = freq * 0.012; 
      lfo.connect(osc.frequency);
      lfo.start(tempoInicio);
      lfo.stop(tempoInicio + duracaoSeg);

      // Filtro da caixa acústica ressonante
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(550, tempoInicio);
      filter.Q.value = 2.5;

      // Envelope ADSR
      const gainNode = audioCtx.createGain();
      gainNode.gain.setValueAtTime(0.0001, tempoInicio);
      gainNode.gain.exponentialRampToValueAtTime(0.28, tempoInicio + 0.06);
      gainNode.gain.exponentialRampToValueAtTime(0.18, tempoInicio + duracaoSeg * 0.75);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, tempoInicio + duracaoSeg);

      osc.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      osc.start(tempoInicio);
      osc.stop(tempoInicio + duracaoSeg);

      agendadorAudio.push(osc);
    }

    function pararAudio() {
      agendadorAudio.forEach(node => {
        try { node.stop(); } catch(e){}
      });
      agendadorAudio = [];
      
      const btnPlay = document.getElementById('btnPlay');
      const btnStop = document.getElementById('btnStop');
      btnPlay.disabled = false;
      btnPlay.innerText = "▶ Tocar Obra";
      btnStop.disabled = true;
    }

    function tocarVioloncelo() {
      const btnPlay = document.getElementById('btnPlay');
      const btnStop = document.getElementById('btnStop');
      btnPlay.disabled = true;
      btnStop.disabled = false;
      btnPlay.innerText = "🔊 Executando...";

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      let tempoAcumulado = audioCtx.currentTime + 0.1;
      const chaveObra = document.getElementById('obraSelect').value;
      const bpm = OBRAS_BACH[chaveObra].tempoBPM;
      const duracaoSeminima = 60 / bpm;

      const duracaoRelativa = {
        "1": duracaoSeminima * 4,
        "2": duracaoSeminima * 2,
        "2h": duracaoSeminima * 3,
        "4": duracaoSeminima,
        "8": duracaoSeminima / 2
      };

      freqsTemaAtuais.forEach((freq, idx) => {
        const duracaoSeg = duracaoRelativa[duracoesTemaAtuais[idx]] || duracaoSeminima;
        tocarNotaVioloncelo(freq, tempoAcumulado, duracaoSeg);
        tempoAcumulado += duracaoSeg;
      });

      const tempoTotal = (tempoAcumulado - audioCtx.currentTime) * 1000;
      setTimeout(() => {
        if (!btnPlay.disabled) return;
        btnPlay.disabled = false;
        btnStop.disabled = true;
        btnPlay.innerText = "▶ Tocar Obra";
      }, tempoTotal);
    }

    // =============================================================

    // =============================================================

    function renderizarPartituraBach(notasFormatadas, fFormula) {
      const container = document.getElementById('partitura-container');
      container.innerHTML = '';

      const NOTAS_POR_SISTEMA = 16;
      const totalSistemas = Math.ceil(notasFormatadas.length / NOTAS_POR_SISTEMA);

      for (let i = 0; i < totalSistemas; i++) {
        const divSistema = document.createElement('div');
        divSistema.id = `sistema-${i}`;
        container.appendChild(divSistema);

        const fatiaNotas = notasFormatadas.slice(i * NOTAS_POR_SISTEMA, (i + 1) * NOTAS_POR_SISTEMA);

        const { Factory, StaveNote, Accidental } = Vex.Flow;
        const vf = new Factory({
          renderer: { elementId: `sistema-${i}`, width: 800, height: 130 }
        });

        const score = vf.EasyScore();
        const system = vf.System({ width: 780 });

        const vexNotes = fatiaNotas.map(item => {
          const [pitch, octave] = item.nota.split('/');
          let note = new StaveNote({
            clef: 'treble',
            keys: [`${pitch}/${octave}`],
            duration: item.duracao.replace('h', '')
          });

          if (pitch.includes('#')) {
            note.addModifier(new Accidental('#'));
          } else if (pitch.includes('b')) {
            note.addModifier(new Accidental('b'));
          }

          return note;
        });

        const stave = system.addStave({
          voices: [vf.Voice({ time: `${fatiaNotas.length}/4` }).addTickables(vexNotes)]
        }).addClef('treble');

        if (i === 0) {
          stave.addTimeSignature(fFormula);
        }

        vf.draw();
      }
    }

    // =============================================================
    // 5. EXECUÇÃO INTEGRADA DO SISTEMA
    // =============================================================

    function executarAlgoritmo() {
      pararAudio();
      
      const chaveObra = document.getElementById('obraSelect').value;
      const obra = OBRAS_BACH[chaveObra];
      const offset = parseInt(document.getElementById('transposicao').value);

      // Extração e cálculo de frequências
      duracoesTemaAtuais = obra.notas.map(n => n.duracao);
      freqsTemaAtuais = obra.notas.map(n => notaParaFrequencia(n.nota, offset));

      // Aplicação da Teoria MPaz (Indexação Helicoidal)
      const coordenadasPaz = mpazHeliceHelicoidal(freqsTemaAtuais);

      // Re-conversão para Notação
      const notasProcessadas = freqsTemaAtuais.map((freq, i) => {
        return {
          nota: frequenciaParaNotaVexFlow(freq),
          duracao: obra.notas[i].duracao
        };
      });

      // Renderização
      renderizarPartituraBach(notasProcessadas, obra.fFormula);

      // Registro da Matriz
      const log = document.getElementById('logMatriz');
      let logHTML = `<b>=== INDEXAÇÃO HELICOIDAL MPAZ (${obra.titulo.toUpperCase()}) ===</b><br>`;
      logHTML += `<b>Matriz Diatônica Helicoidal Assimétrica (N = ${coordenadasPaz.length} nós)</b><br><br>`;
      
      coordenadasPaz.forEach(p => {
        logHTML += `Nó ${p.indice.toString().padStart(3, '0')} [${p.freqHz} Hz] -> <b>Vector MPaz (X,Y,Z):</b> (${p.coordX}, ${p.coordY}, ${p.coordZ}) | &theta;: ${p.thetaRad} rad<br>`;
      });
      log.innerHTML = logHTML;
    }

    window.onload = executarAlgoritmo;
  </script>
